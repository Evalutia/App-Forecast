[job-exec "etl_diario"]
schedule = 0 0 3 * * *
container = evalutia-etl
no-overlap = true
command = /usr/local/bin/run_ofelia.sh

# Issue #102: medicion mensual (dry-run) de elegibilidad econometrica --
# 4am del dia 1 de cada mes, una hora despues del cron diario (3am) para
# evitar contencion de recursos con la extraccion ETL. Job separado e
# independiente del de arriba: nunca escribe en
# articulos_elegibilidad_econometrico, solo deja registro en jobs_historial
# (tipo_job='eval_elegibilidad'). No pasa por Pentaho -- wrapper bash
# simple que invoca ml.run_eval_elegibilidad_dry_run (ver services/etl/
# run_eval_elegibilidad_mensual.sh).
[job-exec "eval_elegibilidad_mensual"]
schedule = 0 0 4 1 * *
container = evalutia-etl
no-overlap = true
command = /bin/bash /app/services/etl/run_eval_elegibilidad_mensual.sh
