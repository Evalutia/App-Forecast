[job-exec "etl_diario"]
schedule = 0 0 3 * * *
container = evalutia-etl
no-overlap = true
command = /usr/local/bin/run_ofelia.sh

# Issue #102/#136: la medicion mensual (dry-run) de elegibilidad
# econometrica YA NO tiene su propio job-exec con horario fijo. El diario
# viene creciendo (2h09->2h44 en dos semanas) y un horario fijo mas tarde
# (ej. 4am, "una hora despues") volvia a quedar corto tarde o temprano --
# paso el 2026-08 (ver .claude/CONTEXTO.md, issue #136). Ahora
# run_ofelia.sh la encadena el mismo al terminar el diario, solo el dia 1
# de cada mes y solo si el diario de esa noche termino bien. Nunca escribe
# en articulos_elegibilidad_econometrico, solo deja registro en
# jobs_historial (tipo_job='eval_elegibilidad'). No pasa por Pentaho --
# wrapper bash simple que invoca ml.run_eval_elegibilidad_dry_run (ver
# services/etl/run_eval_elegibilidad_mensual.sh y el bloque final de
# services/etl/run_ofelia.sh).
